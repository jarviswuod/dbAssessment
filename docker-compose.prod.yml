# ─── Production overrides ───
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires .env with production values:
#   DEBUG=False
#   SECRET_KEY=<real-random-key>
#   ALLOWED_HOSTS=yourdomain.com
#   CORS_ALLOWED_ORIGINS=https://yourdomain.com
#   LOG_LEVEL=WARNING

services:
  # ─── Remove exposed ports on test databases (only backend needs internal access) ───
  postgres_test:
    ports: !reset []

  mysql_test:
    ports: !reset []

  mongo_test:
    ports: !reset []

  clickhouse_test:
    ports: !reset []

  main_db:
    ports: !reset []
    restart: unless-stopped

  # ─── Backend: gunicorn + production settings ───
  backend:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_roles &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -"
    environment:
      - DATABASE_URL=postgresql://${MAIN_DB_USER}:${MAIN_DB_PASSWORD}@main_db:5432/${MAIN_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
      - backend_static:/app/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/auth/login/\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend: production Next.js (pre-built) ───
  frontend:
    command: npm run start
    volumes:
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  backend_logs:
  backend_static:
