services:
  # ─── External Test Databases ───
  postgres_test:
    image: postgres:16-alpine
    container_name: postgres_test
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER} -d ${TEST_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql_test:
    image: mysql:8.0
    container_name: mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TEST_DB_NAME}
      MYSQL_USER: ${TEST_DB_USER}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo_test:
    image: mongo:7
    container_name: mongo_test
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TEST_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${TEST_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${TEST_DB_NAME}
    ports:
      - "27018:27017"
    volumes:
      - mongo_test_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse_test:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_test
    environment:
      CLICKHOUSE_USER: ${TEST_DB_USER}
      CLICKHOUSE_PASSWORD: ${TEST_DB_PASSWORD}
      CLICKHOUSE_DB: ${TEST_DB_NAME}
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse_test_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Main Application Database ───
  main_db:
    image: postgres:16-alpine
    container_name: main_db
    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - main_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USER} -d ${MAIN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Django REST Framework) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment:
      - DATABASE_URL=postgresql://${MAIN_DB_USER}:${MAIN_DB_PASSWORD}@main_db:5432/${MAIN_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      main_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres_test:
        condition: service_healthy
      mysql_test:
        condition: service_healthy
      mongo_test:
        condition: service_healthy
      clickhouse_test:
        condition: service_healthy

  # ─── Redis (Celery broker) ───
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Celery Worker ───
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A config worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${MAIN_DB_USER}:${MAIN_DB_PASSWORD}@main_db:5432/${MAIN_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      main_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (Next.js) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_test_data:
  mysql_test_data:
  mongo_test_data:
  clickhouse_test_data:
  main_db_data:
  backend_media:
